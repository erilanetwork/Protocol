name: CI

on:
  pull_request:
  push:

jobs:
  compile:
    name: Compile protocol
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f236b35da9d031e13b1005234ebe4392ed54c580

      - name: Compile the protocol library
        run: ./gradlew compileJava

  publish:
    name: Publish to Erila Maven
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'push' && github.ref == 'refs/heads/3.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f236b35da9d031e13b1005234ebe4392ed54c580

      - name: Publish to Erila repository
        run: ./gradlew publishMavenPublicationToErilaRepository --no-configuration-cache
        env:
          ERILA_REPO_USERNAME: ${{ secrets.ERILA_REPO_USERNAME }}
          ERILA_REPO_PASSWORD: ${{ secrets.ERILA_REPO_PASSWORD }}
